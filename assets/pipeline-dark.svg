<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <style>
    .bg { fill: #0d1117; rx: 12px; }
    .header-bar { fill: #161b22; rx: 12px 12px 0 0; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; }
    .live-dot { fill: #27c93f; animation: pulse 2s infinite; }
    .live-text { fill: #27c93f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; }
    
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 6px; }
    .box-active { fill: #161b22; stroke: #388bfd; stroke-width: 2; rx: 6px; }
    .box-pass { fill: #161b22; stroke: #27c93f; stroke-width: 2; rx: 6px; }
    
    .code-comment { fill: #8b949e; font-family: "Courier New", Courier, monospace; font-size: 13px; }
    .node-title { fill: #388bfd; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .node-title-pass { fill: #27c93f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: bold; text-anchor: middle; }
    .node-desc { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; text-anchor: middle; }
    .arrow { fill: #8b949e; font-family: monospace; font-size: 14px; font-weight: bold; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
  </style>

  <rect width="900" height="300" class="bg" stroke="#30363d" stroke-width="1" />
  <rect width="900" height="35" class="header-bar" />
  
  <circle cx="25" cy="17" r="6" class="dot-red" />
  <circle cx="45" cy="17" r="6" class="dot-yellow" />
  <circle cx="65" cy="17" r="6" class="dot-green" />
  
  <text x="450" y="21" text-anchor="middle" class="title">sanaullah@lahore:~$ python -m evals.run_suite</text>
  <circle cx="845" cy="17" r="5" class="live-dot" />
  <text x="830" y="21" text-anchor="end" class="live-text">RUNNING</text>

  <text x="30" y="65" class="code-comment"># runtime · rag_pipeline.invoke()</text>

  <rect x="30" y="80" width="115" height="50" class="box" />
  <text x="87" y="102" class="node-title">WEBHOOK</text>
  <text x="87" y="118" class="node-desc">HMAC verified</text>

  <text x="155" y="110" class="arrow">></text>

  <rect x="175" y="80" width="115" height="50" class="box" />
  <text x="232" y="102" class="node-title">CONDENSE</text>
  <text x="232" y="118" class="node-desc">memory · rewrite</text>

  <text x="300" y="110" class="arrow">></text>

  <rect x="320" y="80" width="115" height="50" class="box-active" />
  <text x="377" y="102" class="node-title">RETRIEVE</text>
  <text x="377" y="118" class="node-desc">vectors · top 10</text>

  <text x="445" y="110" class="arrow">></text>

  <rect x="465" y="80" width="115" height="50" class="box" />
  <text x="522" y="102" class="node-title">RERANK</text>
  <text x="522" y="118" class="node-desc">cross-enc · top 3</text>

  <text x="590" y="110" class="arrow">></text>

  <rect x="610" y="80" width="115" height="50" class="box" />
  <text x="667" y="102" class="node-title">GENERATE</text>
  <text x="667" y="118" class="node-desc">grounded prompt</text>

  <text x="735" y="110" class="arrow">></text>

  <rect x="755" y="80" width="115" height="50" class="box" />
  <text x="812" y="102" class="node-title">REPLY</text>
  <text x="812" y="118" class="node-desc">WhatsApp</text>

  <text x="30" y="165" class="code-comment"># release gate · evaluated per component, then end-to-end, with an LLM judge</text>

  <rect x="30" y="180" width="170" height="50" class="box" />
  <text x="115" y="202" class="node-title">COMPONENT</text>
  <text x="115" y="218" class="node-desc">retriever · generator</text>

  <text x="210" y="210" class="arrow">></text>

  <rect x="230" y="180" width="170" height="50" class="box" />
  <text x="315" y="202" class="node-title">END-TO-END</text>
  <text x="315" y="218" class="node-desc">RAG triad · GEval</text>

  <text x="410" y="210" class="arrow">></text>

  <rect x="430" y="180" width="170" height="50" class="box" />
  <text x="515" y="202" class="node-title">SAFETY + OPS</text>
  <text x="515" y="218" class="node-desc">leakage · PII · p95 · cost</text>

  <text x="610" y="210" class="arrow">></text>

  <rect x="630" y="180" width="110" height="50" class="box" />
  <text x="685" y="202" class="node-title">COMPARE</text>
  <text x="685" y="218" class="node-desc">vs baseline</text>

  <text x="750" y="210" class="arrow">></text>

  <rect x="770" y="180" width="100" height="50" class="box-pass" />
  <text x="820" y="202" class="node-title-pass">PASS</text>
  <text x="820" y="218" class="node-desc">gate → ship</text>

  <text x="30" y="265" fill="#388bfd" font-family="monospace" font-size="11px">[generator]</text>
  <text x="110" y="265" fill="#c9d1d9" font-family="monospace" font-size="11px">GEval: correctness · completeness · style</text>
</svg>