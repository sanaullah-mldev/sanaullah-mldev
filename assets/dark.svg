<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; rx: 12px; }
      .header-bar { fill: #f6f8fa; rx: 12px 12px 0 0; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #57606a; font-family: 'Courier New', monospace; font-size: 13px; }
      
      /* Smooth animated glowing border like friend's profile */
      .border-line {
        fill: none;
        stroke: #0969da;
        stroke-width: 2;
        rx: 12px;
        stroke-dasharray: 400 2200;
        animation: borderMove 5s linear infinite;
        filter: drop-shadow(0 0 5px rgba(9, 105, 218, 0.4));
      }

      .text-green { fill: #1a7f37; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-blue { fill: #0969da; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-purple { fill: #8250df; font-family: 'Courier New', monospace; font-size: 13px; }
      .text-dark { fill: #24292f; font-family: 'Courier New', monospace; font-size: 13px; }
      .text-gray { fill: #57606a; font-family: 'Courier New', monospace; font-size: 12px; }

      .cursor { fill: #1f883d; animation: blink 1s infinite; }
      .live-dot { fill: #2da44e; animation: pulse 2s infinite; }
      
      .portrait-box { fill: #f6f8fa; rx: 10px; stroke: #d0d7de; stroke-width: 1; }
      .portrait-group { animation: portraitGlow 3s ease-in-out infinite alternate; }
      .scan-line { fill: #0969da; opacity: 0.5; animation: scanMove 2.5s linear infinite; }

      @keyframes borderMove {
        0% { stroke-dashoffset: 2600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
      @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
      @keyframes portraitGlow {
        0% { filter: drop-shadow(0 0 2px rgba(9, 105, 218, 0.2)); }
        100% { filter: drop-shadow(0 0 8px rgba(9, 105, 218, 0.6)); }
      }
      @keyframes scanMove {
        0% { transform: translateY(0px); }
        50% { transform: translateY(180px); }
        100% { transform: translateY(0px); }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="380" class="bg" stroke="#d0d7de" stroke-width="1" />
  
  <!-- Moving Border Animation -->
  <rect width="900" height="380" class="border-line" />

  <!-- Terminal Header Bar -->
  <rect width="900" height="35" class="header-bar" />
  <circle cx="25" cy="17" r="6" class="dot-red" />
  <circle cx="45" cy="17" r="6" class="dot-yellow" />
  <circle cx="65" cy="17" r="6" class="dot-green" />
  <text x="380" y="22" text-anchor="middle" class="title-text">sanaullah@lahore:~$ whoami</text>
  
  <!-- Live Indicator -->
  <circle cx="865" cy="17" r="4" class="live-dot" />
  <text x="845" y="21" class="text-green" font-size="11px">LIVE</text>

  <!-- Left Side Avatar Box -->
  <rect x="35" y="50" width="220" height="300" class="portrait-box" />
  
  <!-- Detailed Dithered Portrait Matrix (Like Friend's Style) -->
  <g class="portrait-group" transform="translate(62, 65)">
    <!-- Hair Pixels Top -->
    <rect x="35" y="10" width="100" height="10" fill="#0969da" />
    <rect x="25" y="20" width="120" height="15" fill="#0969da" />
    <rect x="20" y="35" width="130" height="15" fill="#0969da" />
    
    <!-- Forehead & Eyebrows -->
    <rect x="20" y="50" width="130" height="15" fill="#58a6ff" />
    <rect x="35" y="60" width="30" height="5" fill="#0969da" />
    <rect x="105" y="60" width="30" height="5" fill="#0969da" />

    <!-- Eyes and Nose Matrix -->
    <rect x="20" y="65" width="130" height="25" fill="#58a6ff" />
    <rect x="40" y="72" width="20" height="8" fill="#ffffff" rx="2" />
    <rect x="45" y="75" width="8" height="4" fill="#0969da" />
    <rect x="110" y="72" width="20" height="8" fill="#ffffff" rx="2" />
    <rect x="115" y="75" width="8" height="4" fill="#0969da" />
    <rect x="78" y="80" width="14" height="12" fill="#0969da" />

    <!-- Mouth & Cheeks -->
    <rect x="20" y="90" width="130" height="20" fill="#58a6ff" />
    <rect x="65" y="100" width="40" height="6" fill="#0969da" rx="2" />

    <!-- Beard / Jawline Dithering -->
    <rect x="20" y="110" width="130" height="25" fill="#0969da" />
    <rect x="30" y="115" width="15" height="10" fill="#58a6ff" />
    <rect x="60" y="118" width="50" height="10" fill="#58a6ff" />
    <rect x="125" y="115" width="15" height="10" fill="#58a6ff" />

    <!-- Neck & Shoulders -->
    <rect x="45" y="135" width="80" height="20" fill="#58a6ff" />
    <rect x="15" y="155" width="140" height="35" fill="#0969da" rx="6" />
    
    <!-- Scanning Light Line -->
    <rect x="15" y="0" width="140" height="3" class="scan-line" rx="1" />
  </g>

  <text x="145" y="325" class="text-gray" text-anchor="middle">// dithered_portrait.render()</text>
  <circle cx="45" cy="331" r="3" fill="#8250df" />

  <!-- Right Side System Info List -->
  <g transform="translate(280, 55)">
    <text x="0" y="25" class="text-blue">SYSTEM. INFO</text>
    <line x1="0" y1="35" x2="580" y2="35" stroke="#d0d7de" stroke-width="1" />

    <text x="0" y="70" class="text-blue">NAME</text>
    <text x="110" y="70" class="text-dark">: SanaUllah Rustmani</text>

    <text x="0" y="105" class="text-blue">ROLE</text>
    <text x="110" y="105" class="text-dark">: Machine Learning and AI Developer</text>

    <text x="0" y="140" class="text-blue">FOCUS</text>
    <text x="110" y="140" class="text-dark">: AI Agents, RAG, GenAI and MLOps</text>

    <text x="0" y="175" class="text-blue">STACK</text>
    <text x="110" y="175" class="text-dark">: Python, PyTorch, LangGraph and FastAPI</text>

    <text x="0" y="210" class="text-blue">LOCATION</text>
    <text x="110" y="210" class="text-dark">: Lahore, Pakistan</text>

    <text x="0" y="245" class="text-blue">STATUS</text>
    <circle cx="114" cy="241" r="4" fill="#2da44e" />
    <text x="130" y="245" class="text-dark">ONLINE</text>

    <text x="0" y="295" class="text-gray">$</text>
    <text x="20" y="295" class="text-dark">build_ai_systems_that_are_reliable_and_secure</text>
    <rect x="375" y="282" width="8" height="15" class="cursor" />
  </g>
</svg>