<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; rx: 12px; }
      .header-bar { fill: #161b22; rx: 12px 12px 0 0; }
      .dot-red { fill: #ff5f56; }
      .dot-yellow { fill: #ffbd2e; }
      .dot-green { fill: #27c93f; }
      .title-text { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }
      
      .border-line {
        fill: none;
        stroke: #388bfd;
        stroke-width: 2;
        rx: 12px;
        stroke-dasharray: 200 800;
        animation: borderMove 4s linear infinite;
      }

      .text-green { fill: #27c93f; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-blue { fill: #388bfd; font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold; }
      .text-purple { fill: #bc8cff; font-family: 'Courier New', monospace; font-size: 13px; }
      .text-white { fill: #c9d1d9; font-family: 'Courier New', monospace; font-size: 13px; }
      .text-gray { fill: #8b949e; font-family: 'Courier New', monospace; font-size: 13px; }

      .cursor { fill: #5ee6b0; animation: blink 1s infinite; }

      @keyframes borderMove {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="900" height="320" class="bg" stroke="#30363d" stroke-width="1" />
  
  <!-- Moving Outer Border Light -->
  <rect width="900" height="320" class="border-line" />

  <!-- Terminal Header Bar -->
  <rect width="900" height="35" class="header-bar" />
  <circle cx="25" cy="17" r="6" class="dot-red" />
  <circle cx="45" cy="17" r="6" class="dot-yellow" />
  <circle cx="65" cy="17" r="6" class="dot-green" />
  <text x="450" y="22" text-anchor="middle" class="title-text">sanaullah@lahore:~$ neofetch --system-info</text>

  <!-- Left Side Avatar Container -->
  <rect x="35" y="60" width="200" height="230" fill="#161b22" rx="10" stroke="#30363d" stroke-width="1" />
  <circle cx="135" cy="145" r="70" fill="#388bfd" opacity="0.2" />
  <text x="135" y="150" font-family="&#39;Courier New&#39;, monospace" font-size="40" fill="#5ee6b0" text-anchor="middle" font-weight="bold">AI</text>
  <text x="135" y="260" font-family="&#39;Courier New&#39;, monospace" font-size="12" fill="#8b949e" text-anchor="middle">SanaUllah | ML Dev</text>

  <!-- Right Side System Info List -->
  <g transform="translate(260, 50)">
    <text x="0" y="30" class="text-green">OS:</text>
    <text x="120" y="30" class="text-white">Ubuntu 24.04 LTS x86_64 (Lahore, PK)</text>

    <text x="0" y="55" class="text-green">Host:</text>
    <text x="120" y="55" class="text-white">SanaUllah Rustmani</text>

    <text x="0" y="80" class="text-green">Role:</text>
    <text x="120" y="80" class="text-blue">Machine Learning & AI Developer</text>

    <text x="0" y="105" class="text-green">Core Stack:</text>
    <text x="120" y="105" class="text-purple">Python | GenAI | Agentic AI | RAG</text>

    <text x="0" y="130" class="text-green">Frameworks:</text>
    <text x="120" y="130" class="text-white">LangChain, LangGraph, PyTorch, FastAPI</text>

    <text x="0" y="155" class="text-green">Status:</text>
    <text x="120" y="155" class="text-white">Building Industry-Level AI Systems</text>

    <text x="0" y="180" class="text-green">Uptime:</text>
    <text x="120" y="180" class="text-white">100% Scholarship @ Lahore College</text>

    <text x="0" y="215" class="text-blue">sanaullah@lahore:~$</text>
    <text x="180" y="215" class="text-gray">echo "Ready to innovate"</text>
    <rect x="345" y="202" width="8" height="15" class="cursor" />
  </g>
</svg>